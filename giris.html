<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş — Meydan Şarküteri</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#D6202A">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;800&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23D6202A'/%3E%3Cpath d='M6 22V10h4l6 8 6-8h4v12' fill='none' stroke='%23FFCE00' stroke-width='3.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="kimlik-govde">

<div class="tente" aria-hidden="true"></div>

<main class="kimlik">
  <div class="kimlik-kart">

    <a class="logo kimlik-logo" href="/">
      <span class="logo-mark" aria-hidden="true">M</span>
      <span class="logo-yazi">
        <strong>Meydan</strong>
        <em>Şarküteri</em>
      </span>
    </a>

    <!-- Yükleniyor: /api/oturum yanıtı gelene kadar. Zaten girişliyse
         forma hiç bakmadan panele gidiyoruz. -->
    <p class="kimlik-yukleniyor" id="yukleniyor" role="status">Kontrol ediliyor…</p>

    <!-- ---------- giriş ---------- -->
    <form class="kimlik-form" id="giris-form" hidden autocomplete="on">
      <h1 class="kimlik-baslik">Tezgâh yönetimi</h1>
      <p class="kimlik-alt">Devam etmek için giriş yapın.</p>

      <p class="kimlik-hata" id="giris-hata" role="alert" hidden></p>

      <label class="kimlik-etiket" for="kullanici">Kullanıcı adı</label>
      <input class="kimlik-girdi" id="kullanici" name="username" type="text"
             autocomplete="username" autocapitalize="none" autocorrect="off"
             spellcheck="false" required>

      <label class="kimlik-etiket" for="sifre">Şifre</label>
      <input class="kimlik-girdi" id="sifre" name="password" type="password"
             autocomplete="current-password" required>

      <button class="dugme dugme-dolu kimlik-dugme" id="giris-dugme" type="submit">
        Giriş yap
      </button>
    </form>

    <!-- ---------- zorunlu şifre değiştirme ----------
         Geçici şifreyle girildiğinde açılır. Kapatma yolu yok:
         panele ancak şifre değiştirildikten sonra geçilebiliyor. -->
    <form class="kimlik-form" id="degistir-form" hidden autocomplete="on">
      <h1 class="kimlik-baslik">Şifrenizi belirleyin</h1>
      <p class="kimlik-alt">
        Geçici şifreyle girdiniz. Devam etmek için yeni bir şifre
        belirlemeniz gerekiyor.
      </p>

      <p class="kimlik-hata" id="degistir-hata" role="alert" hidden></p>

      <!-- Şifre yöneticileri için gizli kullanıcı adı alanı -->
      <input id="degistir-kullanici" name="username" type="text"
             autocomplete="username" hidden aria-hidden="true" tabindex="-1">

      <label class="kimlik-etiket" for="mevcut-sifre">Geçici şifre</label>
      <input class="kimlik-girdi" id="mevcut-sifre" name="current-password"
             type="password" autocomplete="current-password" required>

      <label class="kimlik-etiket" for="yeni-sifre">Yeni şifre</label>
      <input class="kimlik-girdi" id="yeni-sifre" name="new-password"
             type="password" autocomplete="new-password" minlength="12" required>
      <p class="kimlik-ipucu">En az 12 karakter.</p>

      <label class="kimlik-etiket" for="yeni-sifre-tekrar">Yeni şifre (tekrar)</label>
      <input class="kimlik-girdi" id="yeni-sifre-tekrar" name="new-password"
             type="password" autocomplete="new-password" minlength="12" required>

      <button class="dugme dugme-dolu kimlik-dugme" id="degistir-dugme" type="submit">
        Şifreyi değiştir ve devam et
      </button>
    </form>

    <p class="kimlik-geri"><a href="/">← Katalog sayfasına dön</a></p>
  </div>
</main>

<script src="js/giris.js"></script>
</body>
</html>
